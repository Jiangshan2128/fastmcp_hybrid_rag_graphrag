[project]
name = "ainote-mcp-server"
version = "0.1.0"
description = "AI Note MCP Knowledge Base Server — RAG + GraphRAG"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastmcp>=3.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "langchain>=1.3.2",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-text-splitters>=0.3.0",
    "qdrant-client>=1.9.0",
    "langchain-qdrant>=0.1.0",
    "docx2txt>=0.9",
    "langchain-experimental>=0.4.2",
    "mammoth>=1.12.0",
    "markdownify>=1.2.3",
    "FlagEmbedding>=1.3.0",
    "dashscope>=1.26.0",
    "graphrag>=0.5.0",
    "pandas>=2.0.0",
    "lancedb>=0.12.0",
]

[tool.setuptools.packages.find]
exclude = ["__pycache__*"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]
